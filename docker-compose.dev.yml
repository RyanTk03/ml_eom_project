services:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    working_dir: /app
    command: pnpm --filter @ml-eom/web dev
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    networks:
      - backend
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: builder
    working_dir: /app
    command: pnpm --filter @ml-eom/auth-service dev
    volumes:
      - .:/app
      - auth_node_modules:/app/node_modules
    restart: unless-stopped
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
      target: builder
    working_dir: /app
    command: pnpm --filter @ml-eom/user-service dev
    volumes:
      - .:/app
      - user_node_modules:/app/node_modules
    restart: unless-stopped
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users.rule=PathPrefix(`/api/users`)"
      - "traefik.http.routers.users.entrypoints=web"
      - "traefik.http.services.users.loadbalancer.server.port=8082"

  traefik:
    build:
      context: ./gateway
    container_name: traefik
    ports:
      - "9000:80"
      - "9080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - backend
    restart: unless-stopped

volumes:
  web_node_modules:
  auth_node_modules:
  user_node_modules:

networks:
  backend:
    name: backend
    driver: bridge