services:

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mongo:7.0
    restart: unless-stopped
    networks:
      - backend
    environment:
      MONGO_INITDB_ROOT_USERNAME: good_username
      MONGO_INITDB_ROOT_PASSWORD: strong_password
    volumes:
      - database:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--username", "good_username", "--password", "strong_password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"
    # restart: unless-stopped
    # environment:
    #   RABBITMQ_URL: amqp://app:change_me_dev_only@rabbitmq:5672
    # depends_on:
    #   rabbitmq:
    #     condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users.rule=PathPrefix(`/api/users`)"
      - "traefik.http.routers.users.entrypoints=web"
      - "traefik.http.services.users.loadbalancer.server.port=8082"
    # environment:
    #   RABBITMQ_URL: amqp://app:change_me_dev_only@rabbitmq:5672
    # depends_on:
    #   rabbitmq:
    #     condition: service_healthy

  project-service:
    build:
      context: .
      dockerfile: apps/project-service/Dockerfile
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.projects.rule=PathPrefix(`/api/projects`)"
      - "traefik.http.routers.projects.entrypoints=web"
      - "traefik.http.services.projects.loadbalancer.server.port=8084"

  traefik:
    build:
      context: ./gateway
    container_name: "traefik"
    ports:
      - "9000:80"
      - "9080:8080" 
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=http://localhost:3000"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.cors.headers.addvaryheader=true"

volumes:
  rabbitmq_data:
  database:

networks:
  backend:
    name: backend
    driver: bridge